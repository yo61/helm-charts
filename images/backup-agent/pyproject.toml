[project]
name = "lastlight-backup"
version = "0.1.0"
description = "Backup and restore agent for Last Light's two-store state"
requires-python = ">=3.14"
dependencies = [
    "boto3==1.43.80",
    "cyclopts==4.23.2",
    "prometheus-client==0.26.0",
    "psycopg[binary]==3.3.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "semver==3.0.4",
]

[project.scripts]
lastlight-backup = "lastlight_backup.cli:app"

[dependency-groups]
dev = [
    "moto[s3]==5.2.3",
    "pytest==9.1.1",
    "ruff==0.16.4",
    "ty==0.0.74",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
