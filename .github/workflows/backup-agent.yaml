name: backup-agent

on:
  pull_request:
    paths:
      - "images/backup-agent/**"
      - ".github/workflows/backup-agent.yaml"

# Least privilege by default; the publish job raises it for itself later.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images/backup-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      # --locked fails if uv.lock is stale, so a dependency change that was
      # never locked cannot pass CI and then behave differently in the image.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -q
